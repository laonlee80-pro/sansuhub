<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>계산도구 | 산수허브</title>
<meta name="description" content="산수허브 계산도구 — 책별 Calcpad 설계 예제 모음.">
<style>
  :root{--ink:#1f2933;--sub:#5f6b76;--line:#e2e5e9;--bg:#fff;--soft:#f5f6f8;--accent:#185fa5;--accent-soft:#e6f1fb;--basic:#0f6e56;--basic-bg:#e1f5ee;}
  *{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;color:var(--ink);background:var(--bg);line-height:1.6}
  a{text-decoration:none;color:inherit}.wrap{max-width:900px;margin:0 auto;padding:0 24px}
  header{border-bottom:1px solid var(--line);padding:40px 0 28px}
  .crumb{font-size:13px;color:var(--sub)}.crumb a{color:var(--accent)}
  h1{font-size:26px;font-weight:800;margin-top:10px}.lead{color:var(--sub);font-size:15px;margin-top:8px}
  main{padding:34px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
  .card{border:1px solid var(--line);border-radius:12px;padding:22px;transition:border-color .15s,transform .15s}
  .card.on:hover{border-color:var(--accent);transform:translateY(-2px)}
  .card.on{background:var(--accent-soft);border-color:#bcd6f0}
  .card.off{opacity:.6}
  .card h2{font-size:17px;font-weight:700;margin-bottom:6px}.card p{font-size:14px;color:var(--sub)}
  .pill{display:inline-block;margin-top:12px;font-size:12px;padding:3px 10px;border-radius:6px}
  .pill.live{background:var(--basic-bg);color:var(--basic)}.pill.soon{background:var(--soft);color:var(--sub)}
  footer{padding:36px 0 60px;text-align:center;font-size:13px;color:var(--sub)}
</style></head><body>
<header><div class="wrap">
  <div class="crumb"><a href="../index.html">산수허브 홈</a> › 계산도구</div>
  <h1>계산도구</h1>
  <p class="lead">책별로 정리된 Calcpad 설계 예제입니다. 입력폼에 현장 수치를 넣어 즉시 계산하세요.</p>
</div></header>
<main class="wrap"><div class="grid">
  <a class="card on" href="dongbari/index.html">
    <h2>거푸집동바리 설계</h2>
    <p>하중계산·부재설계·벽체·슬래브·기둥·특수구조물·비계 예제 45제.</p>
    <span class="pill live">예제 45제 · 공개중</span>
  </a>
  <div class="card off">
    <h2>다음 시리즈</h2>
    <p>후속 도서의 설계 계산 예제가 이곳에 추가될 예정입니다.</p>
    <span class="pill soon">준비 중</span>
  </div>
</div></main>
<footer><div class="wrap"><p>산수허브 SANSUHUB · 토목구조물의 설계 · 건설기술 개발</p></div></footer>
</body></html>
